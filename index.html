:root{--ink:#163c34;--green:#173f37;--mint:#ffe7a6;--cream:#ffffff;--paper:#ffffff;--line:#d9dfd7;--muted:#64746c;--purple:#966600}*{box-sizing:border-box}body{margin:0;background:#ffffff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;background:var(--cream);padding:22px 18px 72px}header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:800}.brand{font-size:27px;line-height:1.15;margin:5px 0 0;letter-spacing:-1px}.badge{font-size:12px;font-weight:800;color:#fff;background:var(--green);padding:7px 10px;border-radius:999px}.intro{color:var(--muted);font-size:14px;line-height:1.55;margin:8px 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 20px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.cta{width:100%;padding:15px 17px;border:0;border-radius:16px;background:#f3be2c;color:#173f37;font:800 16px inherit;text-align:left;box-shadow:0 5px 0 #d29b11;cursor:pointer}.cta small{display:block;opacity:.75;font-size:12px;margin-top:3px;font-weight:500}.section{margin-top:28px}.section-title{display:flex;align-items:center;justify-content:space-between;font-weight:800;margin:0 2px 10px}.section-title button{border:0;background:transparent;color:var(--green);font:700 12px inherit;cursor:pointer}.lead{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0}.lead-head{display:flex;justify-content:space-between;gap:10px}.lead-name{font-weight:800;font-size:16px}.remark{margin:5px 0 9px;color:var(--purple);font-size:12px;font-weight:700}.meta{font-size:12px;color:var(--muted);line-height:1.5}.pill{height:max-content;background:var(--mint);padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:11px;padding:5px 7px;border-radius:7px;background:#eef1ed}.empty{font-size:13px;color:var(--muted);padding:15px 2px}dialog{border:0;border-radius:22px;width:min(680px,96vw);max-height:92vh;padding:0;box-shadow:0 20px 70px #f3be2c50}dialog::backdrop{background:#f3be2c70}.sheet{background:var(--paper);padding:22px;overflow:auto;max-height:92vh}.sheet h2{font-size:23px;margin:0 0 5px}.hint{font-size:13px;color:var(--muted);line-height:1.45;margin:0 0 18px}.group{border:0;padding:0;margin:0 0 20px}.group-title{font-weight:800;font-size:14px;margin:0 0 9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{margin:0 0 12px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fffdf8;color:var(--ink);font:14px inherit}.field textarea{resize:vertical;min-height:75px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{position:relative}.choice input{position:absolute;opacity:0}.choice span{display:block;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;background:#fffdf8}.choice input:checked+span{background:#fff8db;border-color:#efbd2c;color:#765000;font-weight:800}.stars{display:flex;gap:7px}.stars label{position:relative;cursor:pointer}.stars input{position:absolute;opacity:0}.stars span{display:grid;place-items:center;width:41px;height:38px;border:1px solid var(--line);border-radius:9px;color:#c5bfcf;font-size:19px}.stars input:checked+span{color:#e09a25;background:#fff1c9;border-color:#efc05d}.preview{border:1px dashed #bfc8bd;border-radius:10px;padding:11px;color:var(--muted);font-size:12px}.preview img{width:72px;height:58px;object-fit:cover;border-radius:7px;margin-left:8px;vertical-align:middle}.remark-box{border-radius:12px;background:#f0ecff;padding:12px;font-size:13px;color:#765000;font-weight:800}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.cancel,.save{border:0;border-radius:10px;padding:11px 16px;font:800 14px inherit;cursor:pointer}.cancel{background:#edf0ec;color:var(--green)}.save{background:var(--green);color:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fffdf8eF;border-top:1px solid var(--line);padding:11px max(18px,calc((100vw - 720px)/2 + 18px));display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}@media(max-width:480px){.grid{grid-template-columns:1fr}.app{padding:18px 14px 70px}.sheet{padding:18px}.brand{font-size:24px}}
</style><link rel="stylesheet" href="contact.css"></head><body><main class="app"><header><div><div class="eyebrow">OPPOLIA · CANTON FAIR</div><h1 class="brand">140 广交会客户速记</h1></div><span class="badge">新客户库</span></header><p class="intro">加完 WhatsApp，花 30 秒留下真正有用的客户画像。会后可按意向、行业和项目规模直接筛选跟进。</p><div class="stats"><div class="stat"><b id="total">0</b><span>已记录客户</span></div><div class="stat"><b id="high">0</b><span>高意向（4–5星）</span></div><div class="stat"><b id="today">0</b><span>今天新加</span></div></div><button class="cta" id="openForm">＋ 记录一位新客户<small>联系人 · 项目画像 · 意向 · 现场图片</small></button><section class="section"><div class="section-title"><span>客户列表</span><button id="export">导出 CSV</button></div><div id="leads"></div></section></main><footer class="bottom"><span>140 · 广交会专用</span><span>所有数据仅保存在本机</span></footer>
<dialog id="dialog"><form id="form" class="sheet" method="dialog"><h2>记录 140 新客户</h2><p class="hint">必填只有姓名、国家和 WhatsApp；其余按照交谈深度填写。无需一次写完。</p><fieldset class="group"><legend class="group-title">01 · 联系人</legend><div class="grid"><div class="field"><label>姓名 *</label><input name="name" required placeholder="例如 Daniel Rabasta"></div><div class="field"><label>国家 / 地区 *</label><input name="country" required placeholder="例如 BR / Brazil"></div></div><div class="field"><label>WhatsApp / 电话 *</label><input name="wa" required inputmode="tel" placeholder="例如 +55 11 99999 9999"></div><div class="field"><label>邮箱（如有）</label><input name="email" type="email" placeholder="name@company.com"></div><div class="field"><label>公司名称</label><input name="company" placeholder="例如 ABC Trading"></div></fieldset><fieldset class="group"><legend class="group-title">02 · 客户画像</legend><div class="field"><label>行业背景（可多选）</label><div class="choices"><label class="choice"><input type="checkbox" name="industry" value="定制"><span>定制</span></label><label class="choice"><input type="checkbox" name="industry" value="建筑商"><span>建筑商</span></label><label class="choice"><input type="checkbox" name="industry" value="建材相关"><span>建材相关</span></label><label class="choice"><input type="checkbox" name="industry" value="其他跨行"><span>其他跨行</span></label></div></div><div class="grid"><div class="field"><label>现有项目</label><select name="projects"><option value="">待了解</option><option>1–5</option><option>5–10</option><option>10–20</option><option>20+</option></select></div><div class="field"><label>团队人数</label><select name="team"><option value="">待了解</option><option>1–5</option><option>5–10</option><option>10–20</option><option>20+</option></select></div></div><div class="field"><label>展厅情况</label><textarea name="showroom" placeholder="例如：已有 2 家展厅；计划明年新开店；暂无展厅"></textarea></div></fieldset><fieldset class="group"><legend class="group-title">03 · 本次机会</legend><div class="field"><label>感兴趣的产品 / 需求</label><textarea name="need" placeholder="例如：全屋定制；希望了解当地合作模式；预计首批项目数量"></textarea></div><div class="field"><label>意向（凭现场判断）</label><div class="stars"><label><input type="radio" name="intent" value="1"><span>★</span></label><label><input type="radio" name="intent" value="2"><span>★</span></label><label><input type="radio" name="intent" value="3" checked><span>★</span></label><label><input type="radio" name="intent" value="4"><span>★</span></label><label><input type="radio" name="intent" value="5"><span>★</span></label></div></div><div class="field"><label>现场图片（选填）</label><input id="photo" type="file" accept="image/*" capture="environment"><div class="preview" id="photoPreview">可拍展位、产品或名片；图片只保存在本机。</div></div><div class="field"><label>下一步</label><select name="stage"><option>刚加 WA</option><option>已发目录</option><option>等客户回复</option><option>待报价</option><option>约到展位 / 会面</option></select></div></fieldset><div class="remark-box">WhatsApp 备注建议：<span id="remark">140.地区-姓名</span></div><div class="actions"><button class="cancel" value="cancel">取消</button><button class="save" value="default">保存客户</button></div></form></dialog>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');const key='oppo-canton-140-v2',dialog=document.querySelector('#dialog'),form=document.querySelector('#form'),leadsEl=document.querySelector('#leads');window.leads=JSON.parse(localStorage.getItem(key)||'[]');const esc=s=>String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x])),remark=d=>`140.${(d.country||'地区').trim().toUpperCase()}-${(d.name||'姓名').trim()}`;function save(){localStorage.setItem(key,JSON.stringify(leads))}function render(){const ordered=[...leads].sort((a,b)=>Number(b.intent)-Number(a.intent));total.textContent=leads.length;high.textContent=leads.filter(x=>Number(x.intent)>=4).length;today.textContent=leads.filter(x=>x.date===new Date().toLocaleDateString()).length;leadsEl.innerHTML=ordered.length?ordered.map(x=>`<article class="lead"><div class="lead-head"><div><div class="lead-name">${esc(x.name)}</div><div class="remark">${esc(x.remark)}</div></div><span class="pill">${'★'.repeat(x.intent||3)}${'☆'.repeat(5-(x.intent||3))}</span></div><div class="meta">${esc(x.country)} · ${esc(x.company||'公司待补充')} · WA ${esc(x.wa)}</div><div class="tags"><span class="tag">${esc((x.industry||[]).join(' · ')||'行业待了解')}</span><span class="tag">项目 ${esc(x.projects||'待了解')}</span><span class="tag">${esc(x.stage||'刚加 WA')}</span><span class="tag">${esc(x.need||'需求待补充')}</span></div></article>`).join(''):'<p class="empty">还没有客户。第一次对话结束后，点上面的按钮记录即可。</p>'}function updateRemark(){remarkEl.textContent=remark(Object.fromEntries(new FormData(form)))}const remarkEl=document.querySelector('#remark');openForm.onclick=()=>{form.reset();photoPreview.textContent='可拍展位、产品或名片；图片只保存在本机。';updateRemark();dialog.showModal()};form.addEventListener('input',updateRemark);photo.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>photoPreview.innerHTML=`已选择：${esc(f.name)}<img src="${r.result}" alt="现场图片预览">`;r.readAsDataURL(f)};form.onsubmit=e=>{e.preventDefault();const data=new FormData(form),d=Object.fromEntries(data);d.industry=data.getAll('industry');d.remark=remark(d);d.date=new Date().toLocaleDateString();leads.unshift(d);save();dialog.close();render()};document.querySelector('#export').onclick=()=>{const h=['WhatsApp备注','姓名','国家地区','WhatsApp电话','邮箱','公司','行业','现有项目','展厅情况','团队人数','需求','意向','下一步'],q=x=>`"${String(x||'').replace(/"/g,'""')}"`,csv=[h,...leads.map(x=>[x.remark,x.name,x.country,x.wa,x.email,x.company,(x.industry||[]).join('、'),x.projects,x.showroom,x.team,x.need,x.intent,x.stage])].map(r=>r.map(q).join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='140广交会新客户.csv';a.click()};render()</script><script src="contact.js"></script><script src="upgrade.js"></script></body></html>
